# Tool configuration only; vortup is not packaged.

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["Ui_*.py", "__pycache__"]

[tool.ruff.lint]
select = [
    "F",    # pyflakes: undefined names, unused imports, format-string mismatches
    "E9",   # syntax / IO errors
    "W605", # invalid escape sequences in strings
    "B",    # bugbear: likely bugs
    "T20",  # print() calls
    "UP",   # pyupgrade: outdated syntax
    "G",    # logging format misuse
    "LOG",  # logging API misuse (e.g. logger.warn)
    "I",    # import sorting
]
ignore = [
    "G001",   # .format() inside logging calls: used throughout, harmless
    "G010",   # .warn -> .warning: WRONG for vortex.log.Logger, which has only .warn;
              # ruff cannot tell vortex loggers from Python loggers
    "UP030",  # explicit {0:s} indices in .format(): style only
    "UP031",  # %-formatting: style only
    "UP032",  # .format() -> f-string: style only
]

[tool.ruff.lint.per-file-ignores]
# Standalone scripts and test harnesses may print.
"*_example.py" = ["T20", "F403", "F405"]  # demo scripts use `from PyQt5.QtWidgets import *`
"scan_explorer.py" = ["T20"]
"setmzi.py" = ["T20"]
"data_read.py" = ["T20"]
"jsdecode.py" = ["T20"]
"cuda_benchmark.py" = ["T20"]
"dsb.py" = ["T20"]
"qcp1.py" = ["T20"]
"TestPlotWidget.py" = ["T20"]
"myqt*.py" = ["T20"]
"Galvo.py" = ["T20"]

[tool.ruff.format]

[tool.mypy]
python_version = "3.10"
exclude = ['^Ui_']
ignore_missing_imports = true
explicit_package_bases = true
check_untyped_defs = false
implicit_optional = true  # allow `parent: QWidget = None`, used by every Qt widget here

[[tool.mypy.overrides]]
module = ["vortex.*", "vortex_tools.*", "cupy.*", "PyQt5.*", "qtpy.*"]
follow_imports = "skip"

# Scan GUI helpers set their plot widgets to None in __init__ and create them in
# createEngineComponents(); mypy infers type None and complains on every use.
[[tool.mypy.overrides]]
module = ["RasterScanGuiHelper", "AimingScanGUIHelper", "LineScanGUIHelper", "GalvoTuningScanGUIHelper"]
disable_error_code = ["assignment", "attr-defined"]
